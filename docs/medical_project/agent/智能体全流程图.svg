<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 1880" width="1700" height="1880" role="img" aria-label="MedVision 多模态医疗智能体全流程图：输入校验、规则路由、五个工具、汇总、报告生成、安全校验、整理输出、医生复核与两条反馈回路">
<style>
text{font-family:"Microsoft YaHei","Noto Sans SC","PingFang SC",sans-serif;fill:#1B2429;font-size:11px}
.T{font-size:12px}.b{font-weight:700}.g{font-size:13px;font-weight:700;fill:#163A4F}.lab{fill:#4A5A64}.ttl{font-size:22px;font-weight:700;fill:#163A4F}.sub{font-size:12px;fill:#4A5A64}
.ok{fill:#E4F1E8;stroke:#3E8E5A;stroke-width:1.4}.sim{fill:#FBEFD9;stroke:#C8871E;stroke-width:1.4}.risk{fill:#F8E3E2;stroke:#B8413F;stroke-width:1.4}.new{fill:#ECE6F6;stroke:#6B4FA3;stroke-width:1.4}.dec{fill:#FFFFFF;stroke:#2F7FA6;stroke-width:1.6}.st{fill:#E6F0F6;stroke:#2F7FA6;stroke-width:1.4}.sg{fill:#F5F7F8;stroke:#B9C5CC;stroke-width:1.2}
.e{fill:none;stroke:#6F7E88;stroke-width:1.6;marker-end:url(#ar)}.bus{fill:none;stroke:#6F7E88;stroke-width:1.6}.p{fill:none;stroke:#7A8790;stroke-width:1.6;stroke-dasharray:6 5;marker-end:url(#arp)}
</style>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6F7E88"/></marker>
<marker id="arp" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7A8790"/></marker>
</defs>
<rect width="1700" height="1880" fill="#FFFFFF"/>
<text x="40" y="36" class="ttl">MedVision 多模态医疗智能体 · 全流程图</text>
<text x="40" y="56" class="sub">一次请求从进入到输出：七个编排步骤 · 五个工具的内部流程 · 三态判断 · 循环与分叉 · 两条反馈回路</text>

<!-- 反馈回路一：最终输出 → 意图路由 -->
<path class="p" d="M540,1736 H25 V80 H975 V100"/>
<text x="300" y="74" class="lab">反馈回路（未实现）：路由日志 → 攒路由评测集 → 换成语言模型路由</text>

<!-- 第一行：输入 → 接入 → 校验 → 路由 → 意图 -->
<rect x="40" y="100" width="220" height="76" rx="38" class="ok"/>
<text x="150" y="127" text-anchor="middle" class="T"><tspan class="b">用户输入</tspan><tspan x="150" dy="15">胸片 · 问题 ·</tspan><tspan x="150" dy="15">症状描述 · 化验数据</tspan></text>
<path class="e" d="M260,138 H300"/>
<rect x="300" y="100" width="220" height="76" class="new"/>
<text x="410" y="127" text-anchor="middle" class="T"><tspan class="b">接入层（补充设计）</tspan><tspan x="410" dy="15">鉴权 · 限流 ·</tspan><tspan x="410" dy="15">影像去标识化</tspan></text>
<path class="e" d="M520,138 H560"/>
<rect x="560" y="100" width="250" height="76" class="st"/>
<text x="685" y="127" text-anchor="middle" class="T"><tspan class="b">① 输入校验</tspan><tspan x="685" dy="15">图存在？问题非空？化验是字典？</tspan><tspan x="685" dy="15">有问题只记录，不终止</tspan></text>
<path class="e" d="M810,138 H850"/>
<rect x="850" y="100" width="250" height="76" class="st"/>
<text x="975" y="127" text-anchor="middle" class="T"><tspan class="b">② 意图路由（规则）</tspan><tspan x="975" dy="15">写入意图 · 理由 · 工具计划</tspan><tspan x="975" dy="15">每次决策追加到路由日志</tspan></text>
<path class="e" d="M1100,138 H1130"/>
<polygon points="1220,102 1310,138 1220,174 1130,138" class="dec"/>
<text x="1220" y="142" text-anchor="middle" class="T b">意图？</text>

<!-- 意图 → 执行工具（四种计划） -->
<path class="e" d="M1220,174 V215 H820 V250"/>
<text x="840" y="236" class="lab">纯文本问答：只跑检索 ｜ 影像分析：检测 → 视觉问答 → 检索 ｜ 位置查询：检测 → 定位 → 标注图 ｜ 综合报告：五个工具全跑</text>
<!-- 意图 → 无法处理，短路到⑦ -->
<path class="e" d="M1310,138 H1615 V1549 H1100"/>
<text x="1320" y="118" class="lab">无法处理：无输入 / 图不存在 / 格式不对</text>
<text x="1320" y="132" class="lab">不跑任何工具，短路到 ⑦ 给中文原因</text>

<!-- 第二行：③ 执行工具 -->
<rect x="540" y="250" width="560" height="86" class="st"/>
<text x="820" y="274" text-anchor="middle" class="T"><tspan class="b">③ 执行工具（按计划逐个调用）</tspan><tspan x="820" dy="15">每个工具三态判断：显式仿真？→ 真实后端可用？→ 运行抛异常？</tspan><tspan x="820" dy="15">不可用返回失败且绝不给假数据；失败只记错误，后面的工具照跑</tspan><tspan x="820" dy="15" style="font-size:11px">参数传递：定位 ← 检测标签；检索词 ← 标签中文名；视觉问答 ← 证据文本；标注图 ← 带框发现</tspan></text>
<path class="bus" d="M820,336 V356"/>
<path class="bus" d="M200,356 H1440"/>
<path class="e" d="M200,356 V380"/><path class="e" d="M510,356 V380"/><path class="e" d="M820,356 V380"/><path class="e" d="M1130,356 V380"/><path class="e" d="M1440,356 V380"/>

<!-- 五个工具的分组框 -->
<rect x="55" y="380" width="290" height="422" class="sg"/>
<rect x="365" y="380" width="290" height="638" class="sg"/>
<rect x="675" y="380" width="290" height="396" class="sg"/>
<rect x="985" y="380" width="290" height="680" class="sg"/>
<rect x="1295" y="380" width="290" height="178" class="sg"/>
<text x="200" y="400" text-anchor="middle" class="g">工具一 · 异常检测</text>
<text x="510" y="400" text-anchor="middle" class="g">工具二 · 可解释定位（复用检测网络）</text>
<text x="820" y="400" text-anchor="middle" class="g">工具三 · 视觉问答</text>
<text x="1130" y="400" text-anchor="middle" class="g">工具四 · 证据检索（知识库子系统）</text>
<text x="1440" y="400" text-anchor="middle" class="g">工具五 · 生成标注图</text>
<path class="e" d="M345,392 H365"/><path class="e" d="M655,392 H675"/><path class="e" d="M965,392 H985"/><path class="e" d="M1275,392 H1295"/>

<!-- 工具一 · 异常检测 -->
<rect x="78" y="416" width="244" height="44" class="ok"/>
<text x="200" y="434" text-anchor="middle"><tspan class="b">预处理</tspan><tspan x="200" dy="15">灰度→归一化±1024→裁方→224像素</tspan></text>
<path class="e" d="M200,460 V484"/>
<rect x="78" y="484" width="244" height="44" class="ok"/>
<text x="200" y="502" text-anchor="middle"><tspan class="b">胸片预训练网络 DenseNet121</tspan><tspan x="200" dy="15">多个公开胸片数据集训练</tspan></text>
<path class="e" d="M200,528 V552"/>
<rect x="78" y="552" width="244" height="30" class="ok"/>
<text x="200" y="571" text-anchor="middle">18 类病理概率</text>
<path class="e" d="M200,582 V606"/>
<polygon points="200,606 300,628 200,650 100,628" class="dec"/>
<text x="200" y="632" text-anchor="middle" class="b">分数 ≥ 0.30？</text>
<path class="e" d="M200,650 V674"/><text x="206" y="668" class="lab">是，取前 5</text>
<rect x="78" y="674" width="244" height="44" class="ok"/>
<text x="200" y="692" text-anchor="middle"><tspan class="b">发现列表：标签 + 分数</tspan><tspan x="200" dy="15">标'有依据'，来源 = 检测器</tspan></text>
<path class="e" d="M300,628 H332 V764 H322"/><text x="306" y="624" class="lab">否</text>
<rect x="78" y="742" width="244" height="44" class="ok"/>
<text x="200" y="760" text-anchor="middle"><tspan class="b">无发现（全都低于阈值）</tspan><tspan x="200" dy="15">跳过定位，记错误，仍出报告</tspan></text>

<!-- 工具二 · 可解释定位 -->
<polygon points="510,416 620,438 510,460 400,438" class="dec"/>
<text x="510" y="442" text-anchor="middle" class="b">对每个检出标签（循环）</text>
<path class="e" d="M510,460 V484"/>
<text x="381" y="477" class="lab">↑ 下一个标签（循环）</text>
<rect x="388" y="484" width="244" height="30" class="ok"/>
<text x="510" y="503" text-anchor="middle">前向一次，对该类分数反传</text>
<path class="e" d="M510,514 V538"/>
<rect x="388" y="538" width="244" height="44" class="ok"/>
<text x="510" y="556" text-anchor="middle"><tspan class="b">梯度类激活图</tspan><tspan x="510" dy="15">通道权重 = 梯度均值，加权求和取正</tspan></text>
<path class="e" d="M510,582 V606"/>
<rect x="388" y="606" width="244" height="30" class="ok"/>
<text x="510" y="625" text-anchor="middle">归一化到 0～1，上采样到原图尺寸</text>
<path class="e" d="M510,636 V660"/>
<rect x="388" y="660" width="244" height="30" class="ok"/>
<text x="510" y="679" text-anchor="middle">像素 ≥ 0.5 → 掩码 PNG，记占比</text>
<path class="e" d="M510,690 V714"/>
<rect x="388" y="714" width="244" height="30" class="ok"/>
<text x="510" y="733" text-anchor="middle">最大连通域的外接框，坐标归一化</text>
<path class="e" d="M510,744 V768"/>
<polygon points="510,768 610,790 510,812 410,790" class="dec"/>
<text x="510" y="794" text-anchor="middle" class="b">框面积 ≥ 0.002？</text>
<path class="e" d="M510,812 V836"/><text x="516" y="830" class="lab">是</text>
<rect x="388" y="836" width="244" height="44" class="ok"/>
<text x="510" y="854" text-anchor="middle"><tspan class="b">发现补上框 + 掩码</tspan><tspan x="510" dy="15">占比超过 0.6 标'退化'但仍返回</tspan></text>
<path class="e" d="M610,790 H642 V926 H632"/><text x="616" y="786" class="lab">否</text>
<rect x="388" y="904" width="244" height="44" class="ok"/>
<text x="510" y="922" text-anchor="middle"><tspan class="b">跳过该标签</tspan><tspan x="510" dy="15">记入'跳过原因'</tspan></text>
<path class="bus" d="M388,858 H378"/>
<path class="e" d="M388,926 H378 V438 H400"/>
<path class="e" d="M510,948 V972"/>
<rect x="388" y="972" width="244" height="30" class="ok"/>
<text x="510" y="991" text-anchor="middle">全部标签处理完，热力图 PNG 一并返回</text>

<!-- 工具三 · 视觉问答 -->
<rect x="698" y="416" width="244" height="58" class="sim"/>
<text x="820" y="434" text-anchor="middle"><tspan class="b">构造提示词</tspan><tspan x="820" dy="15">只输出固定字段 JSON，候选病理限 18 类</tspan><tspan x="820" dy="15">不确定给低置信度，不编造图上没有的</tspan></text>
<path class="e" d="M820,474 V498"/>
<rect x="698" y="498" width="244" height="44" class="sim"/>
<text x="820" y="516" text-anchor="middle"><tspan class="b">视觉语言模型 Qwen2.5-VL</tspan><tspan x="820" dy="15">预训练权重，第一阶段不微调</tspan></text>
<path class="e" d="M820,542 V566"/>
<polygon points="820,566 920,588 820,610 720,588" class="dec"/>
<text x="820" y="592" text-anchor="middle" class="b">JSON 解析成功？</text>
<path class="e" d="M820,610 V634"/><text x="826" y="628" class="lab">是</text>
<rect x="698" y="634" width="244" height="58" class="sim"/>
<text x="820" y="652" text-anchor="middle"><tspan class="b">视觉问答结果</tspan><tspan x="820" dy="15">回答 · 置信度 · 发现 · 位置 · 解释</tspan><tspan x="820" dy="15">发现不算'有依据'，只是模型的看法</tspan></text>
<path class="e" d="M920,588 H952 V738 H942"/><text x="926" y="584" class="lab">否</text>
<rect x="698" y="716" width="244" height="44" class="sim"/>
<text x="820" y="734" text-anchor="middle"><tspan class="b">保留原文，标记解析失败</tspan><tspan x="820" dy="15">计入结构化输出失败率</tspan></text>

<!-- 工具四 · 证据检索 -->
<rect x="1008" y="416" width="244" height="30" class="ok"/>
<text x="1130" y="435" text-anchor="middle">检索词 = 问题 + 检出标签中文名</text>
<path class="e" d="M1130,446 V470"/>
<rect x="1008" y="470" width="244" height="44" class="ok"/>
<text x="1130" y="488" text-anchor="middle"><tspan class="b">术语扩展，最多 8 个变体</tspan><tspan x="1130" dy="15">心梗 → 心肌梗死 / 急性心梗 / AMI</tspan></text>
<path class="e" d="M1130,514 V538"/>
<rect x="1008" y="538" width="244" height="44" class="ok"/>
<text x="1130" y="556" text-anchor="middle"><tspan class="b">三路各召回 50</tspan><tspan x="1130" dy="15">语义向量 · 词面 BM25 · 术语倒排</tspan></text>
<path class="e" d="M1130,582 V606"/>
<rect x="1008" y="606" width="244" height="30" class="ok"/>
<text x="1130" y="625" text-anchor="middle">倒数排名融合：只看名次不看分数</text>
<path class="e" d="M1130,636 V660"/>
<polygon points="1130,660 1230,682 1130,704 1030,682" class="dec"/>
<text x="1130" y="686" text-anchor="middle" class="b">精排模型可用？</text>
<path class="e" d="M1130,704 V728"/><text x="1136" y="722" class="lab">是</text>
<rect x="1008" y="728" width="244" height="44" class="sim"/>
<text x="1130" y="746" text-anchor="middle"><tspan class="b">交叉编码器精排前 50</tspan><tspan x="1130" dy="15">问题与片段拼一起做全注意力</tspan></text>
<path class="e" d="M1130,772 V796"/>
<path class="e" d="M1230,682 H1262 V818 H1252"/><text x="1236" y="678" class="lab">否</text>
<rect x="1008" y="796" width="244" height="44" class="ok"/>
<text x="1130" y="814" text-anchor="middle"><tspan class="b">权威度 + 时效加权</tspan><tspan x="1130" dy="15">同分时指南压过百科压过问诊</tspan></text>
<path class="e" d="M1130,840 V864"/>
<polygon points="1130,864 1230,886 1130,908 1030,886" class="dec"/>
<text x="1130" y="890" text-anchor="middle" class="b">绝对相关度 ≥ 0.10？</text>
<path class="e" d="M1130,908 V932"/><text x="1136" y="926" class="lab">是</text>
<rect x="1008" y="932" width="244" height="44" class="ok"/>
<text x="1130" y="950" text-anchor="middle"><tspan class="b">证据列表</tspan><tspan x="1130" dy="15">出处标签 · 片段 · 来源层级 · 分数</tspan></text>
<path class="e" d="M1230,886 H1262 V1022 H1252"/><text x="1236" y="882" class="lab">否</text>
<rect x="1008" y="1000" width="244" height="44" class="risk"/>
<text x="1130" y="1018" text-anchor="middle"><tspan class="b">无证据，标记拒答</tspan><tspan x="1130" dy="15">报告写'未检索到可靠依据'</tspan></text>

<!-- 工具五 · 生成标注图 -->
<rect x="1318" y="416" width="244" height="58" class="ok"/>
<text x="1440" y="434" text-anchor="middle"><tspan class="b">只画发现里有的东西</tspan><tspan x="1440" dy="15">框 + 中文标签与分数</tspan><tspan x="1440" dy="15">+ 半透明掩码</tspan></text>
<path class="e" d="M1440,474 V498"/>
<rect x="1318" y="498" width="244" height="44" class="ok"/>
<text x="1440" y="516" text-anchor="middle"><tspan class="b">标注图 PNG</tspan><tspan x="1440" dy="15">没有发现也输出副本并写'未检出'</tspan></text>

<!-- 五路结果汇入 ④ -->
<path class="bus" d="M200,802 V1090"/><path class="bus" d="M510,1018 V1090"/><path class="bus" d="M820,776 V1090"/><path class="bus" d="M1130,1060 V1090"/><path class="bus" d="M1440,558 V1090"/>
<path class="bus" d="M200,1090 H1440"/>
<path class="e" d="M820,1090 V1120"/>
<text x="850" y="1110" class="lab">五个工具的结果（含失败记录与仿真标记）全部进入汇总</text>

<!-- ④ 汇总 → ⑤ 报告 → ⑥ 安全 -->
<rect x="540" y="1120" width="560" height="72" class="st"/>
<text x="820" y="1145" text-anchor="middle" class="T"><tspan class="b">④ 汇总成结构化报告</tspan><tspan x="820" dy="15">定位只覆盖框和掩码，不改检测分数与来源；失败与仿真都写进注意事项</tspan><tspan x="820" dy="15">摘要用规则拼，不用数字写计数</tspan></text>
<path class="e" d="M820,1192 V1222"/>
<rect x="540" y="1222" width="560" height="72" class="sim"/>
<text x="820" y="1247" text-anchor="middle" class="T"><tspan class="b">⑤ 报告生成（对结构化报告只读）</tspan><tspan x="820" dy="15">医疗 7B 微调对齐模型，或确定性模板；位置按患者左右描述，图像左 = 患者右</tspan><tspan x="820" dy="15">每条结论标引用编号，不给剂量，不做绝对诊断</tspan></text>
<path class="e" d="M820,1294 V1324"/>
<rect x="540" y="1324" width="560" height="86" class="risk"/>
<text x="820" y="1348" text-anchor="middle" class="T"><tspan class="b">⑥ 安全校验</tspan><tspan x="820" dy="15">数字溯源：每个数字在检出分数 / 框 / 证据 / 化验里能找到</tspan><tspan x="820" dy="15">病灶溯源：每个病理名在有依据的发现 / 证据里能找到</tspan><tspan x="820" dy="15">绝对化诊断、剂量表达标记；剂量按（数值，单位）判豁免</tspan></text>
<path class="e" d="M820,1410 V1432"/>
<polygon points="820,1432 980,1462 820,1492 660,1462" class="dec"/>
<text x="820" y="1466" text-anchor="middle" class="T b">有找不到依据的表述？</text>

<!-- 有 → 追加声明；没有 → ⑦ -->
<path class="e" d="M660,1462 H520"/><text x="600" y="1456" class="lab">有</text>
<rect x="200" y="1433" width="320" height="58" class="risk"/>
<text x="360" y="1451" text-anchor="middle"><tspan class="b">末尾追加声明</tspan><tspan x="360" dy="15">'以下表述未能在工具输出中找到依据'</tspan><tspan x="360" dy="15">原文保留，不静默删除</tspan></text>
<path class="e" d="M820,1492 V1520"/><text x="826" y="1512" class="lab">没有</text>
<path class="e" d="M360,1491 V1549 H540"/>
<path class="p" d="M360,1433 V1258 H540"/>
<text x="40" y="1330" class="lab">重写回路（未实现）</text>
<text x="40" y="1345" class="lab">把无依据列表回填提示词</text>
<text x="40" y="1360" class="lab">让报告模型重写，最多 2 次</text>
<rect x="540" y="1520" width="560" height="58" class="st"/>
<text x="820" y="1538" text-anchor="middle" class="T"><tspan class="b">⑦ 整理输出</tspan><tspan x="820" dy="15">来源清单，编号与正文一一对应 · 标注图路径</tspan><tspan x="820" dy="15">无法处理时给中文原因</tspan></text>
<path class="e" d="M820,1578 V1600"/>
<polygon points="820,1600 990,1630 820,1660 650,1630" class="dec"/>
<text x="820" y="1634" text-anchor="middle" class="T b">安全标记为空？（补充设计）</text>
